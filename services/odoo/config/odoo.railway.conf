[options]
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
xmlrpc_port = 8069
log_level = warn

; Database name — must match the -d flag passed to the Odoo start command
db_name = odoo
dbfilter = ^odoo$

; Single-threaded mode — conserves RAM on Railway Hobby plan (~512MB–1GB limit)
; workers = 0 means no gevent workers, Odoo handles requests sequentially
; This is appropriate for low/demo traffic
workers = 0
max_cron_threads = 1

; Memory limits calibrated for Railway Hobby plan
limit_memory_soft = 640000000
limit_memory_hard = 768000000

; Give enough time for first-request asset bundle compilation (JS/CSS minification).
; Without this, Odoo kills the worker mid-compilation and returns 500 on assets.
limit_time_cpu = 120
limit_time_real = 600

; Railway's edge proxy handles TLS termination — must be True so Odoo
; trusts X-Forwarded-For and X-Forwarded-Proto headers from the proxy
proxy_mode = True
